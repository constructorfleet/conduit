[workspace]
resolver = "2"
members = ["crates/conduit-core", "crates/conduit-provider", "crates/conduit-runtime", "crates/conduit-openai", "crates/conduit-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Teagan42/conduit"

[workspace.dependencies]
conduit-core = { path = "crates/conduit-core", version = "0.1.0" }
conduit-provider = { path = "crates/conduit-provider", version = "0.1.0" }
conduit-runtime = { path = "crates/conduit-runtime", version = "0.1.0" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
