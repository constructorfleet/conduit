[workspace]
resolver = "2"
members = ["crates/conduit-core", "crates/conduit-provider", "crates/conduit-runtime", "crates/conduit-metrics", "crates/conduit-store", "crates/conduit-openai", "crates/conduit-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The real floor, not an aspiration: `home 0.5.12` (reached via
# sqlx-postgres -> sqlx -> conduit-store) requires 1.88, so 1.87 cannot resolve
# this workspace at all. Verified by the `msrv` CI job, which reads this value.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Teagan42/conduit"

[workspace.dependencies]
conduit-core = { path = "crates/conduit-core", version = "0.1.0" }
conduit-provider = { path = "crates/conduit-provider", version = "0.1.0" }
conduit-metrics = { path = "crates/conduit-metrics", version = "0.1.0" }
conduit-openai = { path = "crates/conduit-openai", version = "0.1.0" }
conduit-store = { path = "crates/conduit-store", version = "0.1.0" }
conduit-runtime = { path = "crates/conduit-runtime", version = "0.1.0" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-core = "0.3"
futures-util = "0.3"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
