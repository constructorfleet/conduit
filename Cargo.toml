[workspace]
resolver = "2"
members = ["crates/conduit-anthropic", "crates/conduit-bedrock", "crates/conduit-core", "crates/conduit-deepgram", "crates/conduit-elevenlabs", "crates/conduit-mcp", "crates/conduit-provider", "crates/conduit-runtime", "crates/conduit-memory", "crates/conduit-metrics", "crates/conduit-store", "crates/conduit-http", "crates/conduit-openai", "crates/conduit-polly", "crates/conduit-google", "crates/conduit-marytts", "crates/conduit-script", "crates/conduit-speaker", "crates/conduit-transform", "crates/conduit-vad", "crates/conduit-wake", "crates/conduit-wyoming", "crates/conduit-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The real floor, not an aspiration: the AWS SDK crates reached via
# conduit-bedrock — `aws-config`, `aws-sdk-bedrockruntime`, `aws-runtime`, and
# the `aws-smithy-*` family — declare 1.94.1, so anything older cannot resolve
# this workspace at all. (`sqlx 0.9`, the previous floor, declares 1.94.)
# Verified by the `msrv` CI job, which reads this value.
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Teagan42/conduit"

[workspace.dependencies]
conduit-anthropic = { path = "crates/conduit-anthropic", version = "0.1.0" }
conduit-bedrock = { path = "crates/conduit-bedrock", version = "0.1.0" }
conduit-core = { path = "crates/conduit-core", version = "0.1.0" }
conduit-elevenlabs = { path = "crates/conduit-elevenlabs", version = "0.1.0" }
conduit-mcp = { path = "crates/conduit-mcp", version = "0.1.0" }
conduit-provider = { path = "crates/conduit-provider", version = "0.1.0" }
conduit-metrics = { path = "crates/conduit-metrics", version = "0.1.0" }
conduit-memory = { path = "crates/conduit-memory", version = "0.1.0" }
conduit-http = { path = "crates/conduit-http", version = "0.1.0" }
conduit-openai = { path = "crates/conduit-openai", version = "0.1.0" }
# `default-features = false` here rather than only at the use site: a member
# crate's `default-features` is ignored unless the workspace entry declares it,
# so without this the AWS SDK is compiled even by a build that turned the
# `conduit-api/polly` feature off — silently, with a warning that is easy to miss.
conduit-polly = { path = "crates/conduit-polly", version = "0.1.0", default-features = false }
conduit-script = { path = "crates/conduit-script", version = "0.1.0" }
conduit-google = { path = "crates/conduit-google", version = "0.1.0" }
conduit-marytts = { path = "crates/conduit-marytts", version = "0.1.0" }
conduit-deepgram = { path = "crates/conduit-deepgram", version = "0.1.0" }
conduit-speaker = { path = "crates/conduit-speaker", version = "0.1.0" }
conduit-wake = { path = "crates/conduit-wake", version = "0.1.0" }
conduit-vad = { path = "crates/conduit-vad", version = "0.1.0" }
conduit-store = { path = "crates/conduit-store", version = "0.1.0" }
conduit-transform = { path = "crates/conduit-transform", version = "0.1.0" }
conduit-wyoming = { path = "crates/conduit-wyoming", version = "0.1.0" }
conduit-runtime = { path = "crates/conduit-runtime", version = "0.1.0" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-core = "0.3"
futures-util = "0.3"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
# `sync` makes `Engine`/`AST` `Send + Sync` so one engine can be shared across
# turns; `no_closure` removes shared closure captures, whose locking is a hang
# risk the deadline cannot break. Neither is optional for the sandbox.
rhai = { version = "1.25", default-features = false, features = ["std", "sync", "no_closure"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
