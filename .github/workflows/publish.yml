name: Publish

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: python3 scripts/workspace_version.py check

  check:
    runs-on: ubuntu-latest
    # Keep publishing behind the same checks as CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUIT_TEST_POSTGRES_URL: postgres://conduit:conduit@localhost:5432/conduit_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/workspace_version.py check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  publish-docker:
    runs-on: ubuntu-latest
    needs: [version, check, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:v${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: [version, check, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p conduit-api
      - name: Package Rust app and firmware YAMLs
        run: |
          mkdir -p dist/app dist/firmware
          cp target/release/conduit-api dist/app/conduit-api
          cp firmware/esphome/conduit-sat1.yaml dist/firmware/conduit-sat1.yaml
          cp firmware/esphome/conduit-voicepe.yaml dist/firmware/conduit-voicepe.yaml
          tar -C dist/app -czf dist/conduit-api-linux-x86_64.tar.gz conduit-api
          tar -C dist/firmware -czf dist/conduit-firmware-yamls.tar.gz conduit-sat1.yaml conduit-voicepe.yaml
      - id: artifact
        run: |
          artifact="${REGISTRY}/${GITHUB_REPOSITORY,,}/conduit-artifacts"
          echo "name=${artifact}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - name: Publish repo package
        run: |
          oras push "${{ steps.artifact.outputs.name }}:${{ needs.version.outputs.version }}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.version=${{ needs.version.outputs.version }}" \
            "dist/conduit-api-linux-x86_64.tar.gz:application/gzip" \
            "dist/conduit-firmware-yamls.tar.gz:application/gzip"
          oras tag "${{ steps.artifact.outputs.name }}:${{ needs.version.outputs.version }}" latest
          oras tag "${{ steps.artifact.outputs.name }}:${{ needs.version.outputs.version }}" "v${{ needs.version.outputs.version }}"
