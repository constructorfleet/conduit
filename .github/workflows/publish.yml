name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io

jobs:
  # Decides *what* this commit is allowed to publish. VERSIONING.md:32 makes
  # `<version>` and `v<version>` immutable in intent and `latest` the only
  # moving tag, but this workflow runs on every push to main, so re-pushing the
  # version tags unconditionally overwrote a released tag on every unrelated
  # commit.
  #
  # A pushed git tag is the release record: it exists exactly once per version
  # and cannot be recreated by accident. If `v<version>` is already on the
  # remote, this commit is a follow-up to an existing release and may only move
  # `latest`.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.released.outputs.released }}
      revision: ${{ steps.revision.outputs.short }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: python3 scripts/workspace_version.py check
      - id: released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "v${VERSION} is already released; only 'latest' will move."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} has not been released yet; version tags will be created."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - id: revision
        # Every push gets an immutable, unique coordinate even when it publishes
        # no version tag, so that whatever `latest` currently points at can
        # always be named by something other than `latest`.
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  # Publishing runs the same gates as any pull request, by calling the same
  # workflow rather than restating its jobs. This is what makes the firmware,
  # MSRV, and Dockerfile gates apply to releases too.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      code-quality: write

  publish-docker:
    runs-on: ubuntu-latest
    needs: [version, gates]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASED: ${{ needs.version.outputs.released }}
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "list<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${REVISION}"
            if [ "${RELEASED}" != "true" ]; then
              echo "${image}:${VERSION}"
              echo "${image}:v${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  # Conduit Vox — the reference speaker identification service — published
  # beside Conduit so a `docker compose --profile vox up` does not have to build
  # 1.8 GB of torch on the operator's machine.
  #
  # Two tags from one Dockerfile: the CPU image is the default the compose file
  # names, and the GPU one is the same source with a CUDA base and CUDA torch
  # wheels. Suffixed by engine rather than left bare, because a second engine is
  # a class in that service and adding one should not need a new image name.
  publish-vox:
    runs-on: ubuntu-latest
    needs: [version, gates]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: speechbrain
            base: python:3.12-slim-bookworm
            torch_index: https://download.pytorch.org/whl/cpu
            device: cpu
          - suffix: speechbrain-gpu
            base: nvidia/cuda:12.6.3-runtime-ubuntu24.04
            torch_index: https://download.pytorch.org/whl/cu126
            device: cuda
    steps:
      - uses: actions/checkout@v7
      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASED: ${{ needs.version.outputs.released }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-vox"
          {
            echo "list<<EOF"
            echo "${image}:latest-${SUFFIX}"
            if [ "${RELEASED}" != "true" ]; then
              echo "${image}:${VERSION}-${SUFFIX}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          # Repo root: the Dockerfile installs packages/conduit-link, which
          # lives outside the service directory.
          context: .
          file: services/vox/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            TORCH_INDEX=${{ matrix.torch_index }}
            DEVICE=${{ matrix.device }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  # Conduit Excita — the wake-word service (detection + ops per spec 0011),
  # published so a compose profile can bring it up without building locally.
  #
  # Context is the repo root because the Dockerfile installs
  # packages/conduit-link (a workspace-local dependency the service imports at
  # runtime). The vox/memoria/instrumenta Dockerfiles do the same.
  publish-excita:
    runs-on: ubuntu-latest
    needs: [version, gates]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASED: ${{ needs.version.outputs.released }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-excita"
          {
            echo "list<<EOF"
            echo "${image}:latest"
            if [ "${RELEASED}" != "true" ]; then
              echo "${image}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/excita/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: [version, gates]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p conduit-api
      - name: Package Rust app and firmware YAMLs
        run: |
          mkdir -p dist/app dist/firmware
          cp target/release/conduit-api dist/app/conduit-api
          cp firmware/esphome/conduit-sat1.yaml dist/firmware/conduit-sat1.yaml
          cp firmware/esphome/conduit-voicepe.yaml dist/firmware/conduit-voicepe.yaml
          tar -C dist/app -czf dist/conduit-api-linux-x86_64.tar.gz conduit-api
          tar -C dist/firmware -czf dist/conduit-firmware-yamls.tar.gz conduit-sat1.yaml conduit-voicepe.yaml
      - id: artifact
        run: |
          artifact="${REGISTRY}/${GITHUB_REPOSITORY,,}/conduit-artifacts"
          echo "name=${artifact}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2
      - name: Publish repo package
        env:
          ARTIFACT: ${{ steps.artifact.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASED: ${{ needs.version.outputs.released }}
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          # Push to the per-commit tag first, then move the mutable and, for a
          # new version, immutable tags onto it. `oras tag` retags an existing
          # manifest, so every tag here names one uploaded artifact set.
          oras push "${ARTIFACT}:sha-${REVISION}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            "dist/conduit-api-linux-x86_64.tar.gz:application/gzip" \
            "dist/conduit-firmware-yamls.tar.gz:application/gzip"
          oras tag "${ARTIFACT}:sha-${REVISION}" latest
          if [ "${RELEASED}" != "true" ]; then
            oras tag "${ARTIFACT}:sha-${REVISION}" "${VERSION}" "v${VERSION}"
          else
            echo "v${VERSION} is already released; leaving its tags untouched."
          fi

  # Creates the release record only after both packages are published, so a
  # failed publish can be retried by re-running rather than needing a version
  # bump. The tag both marks the release and is what makes the next push to main
  # skip the version tags.
  #
  # `GITHUB_TOKEN` is deliberate rather than a PAT: nothing in this repository
  # triggers on tags, so the fact that its pushes do not start workflows costs
  # nothing, and a PAT would be a long-lived credential to store and rotate for
  # no gain. A workflow that must react to this tag needs `token:` on the
  # checkout below.
  tag-release:
    runs-on: ubuntu-latest
    needs: [version, publish-docker, publish-vox, publish-excita, publish-artifacts]
    if: needs.version.outputs.released != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        # Idempotent by design. The `version` job decided this version was
        # unreleased before the packages were built, so two pushes that land
        # close together can both get here and race for the same tag. Creating
        # it is the release record; failing because someone else already created
        # it would report a broken release for a build that did everything
        # right. Re-tagging is never correct either — VERSIONING.md makes a
        # version tag name one build forever — so an existing tag is left
        # exactly where it is.
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "v${VERSION} was tagged while this build ran; leaving it untouched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Conduit v${VERSION}"
          # A loser of the race fails to push rather than overwriting, because
          # git refuses to update an existing tag ref without --force. Only that
          # specific outcome is benign, so a failed push is diagnosed rather
          # than assumed: if the tag is now on the remote someone else won the
          # race, and anything else is a real failure that must stay red.
          if git push origin "refs/tags/v${VERSION}"; then
            echo "tagged v${VERSION}"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "v${VERSION} was tagged concurrently; leaving it untouched."
          else
            echo "failed to push v${VERSION} and it is not on the remote" >&2
            exit 1
          fi
