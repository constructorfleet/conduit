name: CI

on:
  # No `push: branches: [main]` trigger: Publish also runs on that event and
  # calls this workflow, so a push trigger here would run every gate twice per
  # merge. Pull requests are the gate for anything reaching main.
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  # Publish reuses these exact jobs rather than restating them. A copy of the
  # gates in the publish workflow is a copy that drifts, and the copy that
  # drifts is the one guarding releases.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    # The PostgreSQL tests skip themselves when no database is configured, so
    # without this they would pass by not running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUIT_TEST_POSTGRES_URL: postgres://conduit:conduit@localhost:5432/conduit_test
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain, and a file override beats
      # `rustup default`, so installing "stable" here would install a toolchain
      # that nothing then uses. Installing with no argument installs exactly
      # what the file asks for, including its clippy and rustfmt components.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/workspace_version.py check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Upstream openWakeWord release artifacts, fetched rather than vendored.
      # Without them the in-process detection tests skip, which would make the
      # one thing worth proving about a detector the one thing CI never checks.
      - run: scripts/fetch-wake-models.sh
      # The Silero model, on the same terms and for the same reason. The script
      # verifies a pinned checksum, so a substituted or moved upstream artifact
      # fails here rather than becoming a detector that reports silence forever.
      - run: scripts/fetch-vad-model.sh
      - run: cargo test --workspace --all-features
      # The default feature set must build too, and so must the lean one.
      - run: cargo build --workspace --no-default-features

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No Node line bundles npm 12 yet (24.21.0 ships npm 11.19.0), and
      # `allowScripts` is an npm 12 feature: on npm 11 the field is ignored
      # and every install script runs, so the policy would be documented and
      # unenforced exactly where enforcement matters. The version comes from
      # `packageManager` in package.json so the pin lives in one place.
      - name: Install the npm the install-script policy needs
        working-directory: frontend
        run: |
          want=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@${want}"
          npm --version
      - working-directory: frontend
        run: npm ci
      # `npm install-scripts ls` exits 0 whether or not anything is unreviewed,
      # so the gate is its output: a dependency bump that pulls in a new
      # install script fails here until someone approves or denies it in
      # `allowScripts`, rather than silently running on the next install.
      - name: Check every install script has a recorded decision
        working-directory: frontend
        run: |
          output=$(npm install-scripts ls)
          echo "${output}"
          if ! echo "${output}" | grep -q "No packages with unreviewed install scripts"; then
            echo "::error::a dependency has an install script with no decision in allowScripts" >&2
            exit 1
          fi
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run contract:check
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run format
      # Runs here rather than in `scripts` because it needs the Prettier that
      # `npm ci` just installed. Root and docs markdown is deliberately excluded
      # from Prettier by the root .prettierignore; this proves the exclusion is
      # in place and no wider than intended.
      - name: Test the root .prettierignore
        run: scripts/tests/prettier_ignore_test.sh

  # The repository ruleset enforces a minimum coverage percentage and a maximum
  # drop against the default branch, and that rule blocks a merge when analysis
  # is missing or fails — not only when coverage is low. Nothing produced
  # coverage, so the enforced number described a measurement that was never
  # taken.
  #
  # Separate from `check` rather than folded into it: coverage needs an
  # instrumented rebuild and a second test run, and paying that on the job whose
  # failures are the ones developers wait on would slow down every push to speed
  # up a report nobody reads on a red build.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading to Code Quality is a write, and it is the only extra
      # privilege this job takes.
      code-quality: write
    # Same reason `check` has it: the PostgreSQL tests skip themselves when no
    # database is configured, and a coverage number computed with them skipped
    # would understate the store crate and drift against `check`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUIT_TEST_POSTGRES_URL: postgres://conduit:conduit@localhost:5432/conduit_test
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      # cargo-llvm-cov instruments the build, so it needs llvm-tools; it can
      # install the component itself, but asking rustup for it keeps the
      # toolchain fully described by this file.
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # An instrumented build shares no artifacts with `check`'s, so a
          # shared cache key would have the two jobs evicting each other.
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Cobertura because that is the only format Code Quality ingests. The
      # feature set matches `check` so the number describes the code the gates
      # actually test.
      - run: cargo llvm-cov --workspace --all-features --cobertura --output-path cobertura.xml
      # The action skips fork pull requests on its own — they cannot be given
      # write scope — so measuring still runs and only the upload is dropped.
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov

  # `rust-version` in Cargo.toml is a promise to anyone building Conduit. Every
  # other job runs the pinned modern toolchain, so without this job the declared
  # floor is never compiled against and silently rots upward as dependencies
  # raise their own requirements.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: |
          msrv=$(sed -ne 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [ -z "${msrv}" ]; then
            echo "could not read workspace.package.rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # RUSTUP_TOOLCHAIN, unlike `rustup default`, outranks rust-toolchain.toml.
      # Without it this job would quietly test the pinned toolchain twice.
      #
      # `--locked` matters as much as the compiler version: Cargo refuses to
      # resolve a lockfile whose crates require a newer rustc, which is how a
      # dependency bump that raises the real floor gets caught.
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --locked --workspace --all-features --all-targets
          cargo check --locked --workspace --no-default-features

  # The firmware is a shipped artifact, so it needs a gate. Without this the
  # C, C++, and ESPHome suites run only on whichever developer remembers them.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run firmware test suites
        run: firmware/test.sh
      # firmware/test.sh asserts on YAML *contents* by grepping, which cannot
      # tell a valid document from a syntactically broken one. The publish
      # workflow tarballs these files verbatim, so a stray indent would ship.
      #
      # This is a syntax gate, not a full `esphome config` validation: that
      # resolves external components over the network from pinned git refs, and
      # a firmware gate that fails when GitHub is slow is a gate people learn to
      # ignore. ESPHome's custom tags carry no meaning for a syntax check, so
      # they are accepted and discarded.
      - name: Check ESPHome YAML parses
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 - <<'PY'
          import sys
          import yaml


          class EsphomeLoader(yaml.SafeLoader):
              """Parses ESPHome YAML without interpreting its custom tags."""


          EsphomeLoader.add_multi_constructor("!", lambda loader, suffix, node: None)

          failed = False
          for path in (
              "firmware/esphome/conduit-sat1.yaml",
              "firmware/esphome/conduit-voicepe.yaml",
          ):
              try:
                  document = yaml.load(open(path, encoding="utf-8"), Loader=EsphomeLoader)
              except yaml.YAMLError as error:
                  print(f"{path}: not valid YAML: {error}", file=sys.stderr)
                  failed = True
                  continue
              if not isinstance(document, dict) or "esphome" not in document:
                  print(f"{path}: parsed, but has no top-level 'esphome' key", file=sys.stderr)
                  failed = True
                  continue
              print(f"{path}: ok ({len(document)} top-level keys)")

          sys.exit(1 if failed else 0)
          PY

  # The development script is how a contributor runs the stack, so a change that
  # breaks its flag handling breaks the first thing anyone does with the
  # repository. The tests need no toolchain: every case is `--dry-run`, which
  # resolves the configuration and starts nothing.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test scripts/dev.sh
        run: scripts/tests/dev_test.sh
      - name: Test scripts/lib/model-fetch.sh
        run: scripts/tests/model_fetch_test.sh
      - name: Test scripts/prune-target.sh
        run: scripts/tests/prune_target_test.sh
      - name: Check the service base images agree
        run: scripts/tests/base_image_parity_test.sh

  # One linter for every Python directory, rather than a step in each service
  # job: memoria has no test job at all, so a per-job step would have left it
  # unlinted, and five copies of an install is five places for the pin to
  # drift. Ruff is fast enough that a whole-repository pass costs less than the
  # checkout.
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned: Ruff's default rule set has widened across releases, and an
      # unpinned linter fails builds that nobody changed. ruff.toml selects the
      # rules explicitly for the same reason.
      - run: pip install ruff==0.16.8
      - run: ruff check services packages/conduit-link

  # Conduit Vox — the reference speaker identification service — ships in this
  # repository and is published as an image, so its tests and its build are
  # gates like any other.
  vox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vox/requirements-dev.txt
      # requirements-dev deliberately excludes torch: the tests inject their own
      # encoder, so a CI run neither downloads a model nor installs a deep
      # learning framework to check that a 404 is a 404.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      # Uncached, for the same reason the Conduit image build is: a torch layer
      # runs to gigabytes and would evict the far more frequently used Rust
      # cache entries from the same repository budget.
      - uses: docker/setup-buildx-action@v4
      # Context is the repo root, not services/vox: the Dockerfile installs
      # packages/conduit-link, which lives outside the service directory.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/vox/Dockerfile
          push: false

  # The reference Wyoming ASR service ships in this repository, so its tests are
  # a gate like any other.
  wyoming-asr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wyoming-asr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/wyoming-asr/requirements-dev.txt
      # requirements-dev deliberately excludes both NeMo and torch: the tests
      # inject their own engine, so a CI run downloads no model weights and
      # touches no network. A test that needed a gigabyte of download is a test
      # that would not run.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      # No image build here, unlike the vox job. NeMo plus a torch wheel
      # is tens of gigabytes to resolve and install, which is beyond what a
      # pull-request runner should spend on every commit; the Dockerfile is
      # checked by the compose job resolving its build context, and the image is
      # built when it is published.

  # Conduit Instrumenta — the MCP aggregator — ships in this repository and is
  # published as an image, so its tests and its build are gates like any other.
  instrumenta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 3.13 because the Dockerfile is on python:3.13-slim. Testing on a
      # different minor than the image runs would let a green job ship an
      # image that fails on a version difference.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/instrumenta/requirements-dev.txt
      # conduit-link is a workspace-local package app.py imports at runtime,
      # so an install of only PyPI dependencies would ImportError on boot.
      # Editable install here matches how the image installs it.
      - name: Install test dependencies
        working-directory: services/instrumenta
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e ../../packages/conduit-link
      # PYTHONPATH is the services directory because the tests import the
      # service as the package `instrumenta`, the same name the image runs it
      # under.
      - name: Run tests
        working-directory: services/instrumenta
        env:
          PYTHONPATH: ..
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@v4
      # Context is the repo root, not services/instrumenta: the Dockerfile
      # installs packages/conduit-link, which lives outside the service
      # directory.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/instrumenta/Dockerfile
          load: true
          tags: instrumenta:ci
      # A build that succeeds is not an image that runs. The module list in
      # the Dockerfile had gone stale and the published image could not import
      # its own app, which a build alone never notices — so start the
      # container and read /health, the same proof the conduit image gets.
      - name: Check the built image starts
        run: |
          key=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run --detach --name instrumenta-ci --publish 8085:8085 \
            --env INSTRUMENTA_SECRET_KEY="${key}" instrumenta:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8085/health; then
              echo
              docker rm --force instrumenta-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "instrumenta did not answer /health within 30s" >&2
          docker logs instrumenta-ci >&2
          docker rm --force instrumenta-ci >/dev/null
          exit 1

  # Conduit Excita — the wake-word service (detection + ops per spec 0011) —
  # ships in this repository and is published as an image, so its tests and
  # its build are gates like any other.
  excita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python 3.11 because openwakeword requires `tflite-runtime<3` as an
      # unconditional dep and tflite-runtime does not publish wheels for
      # 3.12+ yet. The Dockerfile is pinned to the same version for the
      # same reason; drifting the CI Python off it would let a green build
      # ship a red image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/excita/requirements-dev.txt
      # conduit-link is a workspace-local package the service imports at
      # runtime, so an image that installs only PyPI dependencies would
      # ImportError on boot. Editable install here matches how the tests run.
      - name: Install test dependencies
        working-directory: services/excita
        run: |
          pip install -r requirements-dev.txt
          pip install -e ../../packages/conduit-link
      # Same fetcher the `check` job uses for the Rust conduit-wake tests.
      # The detection tests skip when the models aren't there, which would
      # let the one thing worth proving about a detector be the one thing
      # CI never checks.
      - run: scripts/fetch-wake-models.sh
      - name: Run tests
        working-directory: services/excita
        env:
          PYTHONPATH: ..
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@v4
      # Context is the repo root, not services/excita: the Dockerfile installs
      # packages/conduit-link, which lives outside the service directory. The
      # instrumenta/memoria/vox images do the same.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/excita/Dockerfile
          push: false

  # Memoria's builtin backend is lightweight enough for pull-request CI. Its
  # Dockerfile and tests are otherwise easy to let rot while only the Rust
  # workspace stays green.
  memoria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memoria
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/memoria/requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/memoria/Dockerfile
          push: false

  # `docker compose up` is the documented way to run Conduit, so a compose file
  # that does not parse is a broken front door. `config` resolves variables,
  # profiles, and the build contexts without starting anything.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the compose file resolves
        run: |
          docker compose config --quiet
          docker compose --profile vox config --quiet
          # The legacy profile name is kept for one release cycle; verify it too.
          docker compose --profile speaker-id config --quiet
          docker compose --profile instrumenta-postgres config --quiet
          docker compose --profile wyoming-asr config --quiet
          # The default `up` must not need the optional profile, or the
          # smallest thing that runs is not the default.
          services=$(docker compose config --services | tr '\n' ' ')
          if [ "${services}" != "conduit " ]; then
            echo "default profile should start conduit alone, got '${services}'" >&2
            exit 1
          fi

  instrumenta-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instrumenta/requirements.txt
      - name: Install test dependencies
        run: pip install -r instrumenta/requirements.txt
      - name: Run Instrumenta tests against SQLite and PostgreSQL
        env:
          PYTHONPATH: .
          INSTRUMENTA_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m pytest -q instrumenta

  # The published image is built from this Dockerfile, so a change that breaks
  # it must fail before the image is published. Building without pushing needs
  # no registry credentials.
  #
  # The build itself does not run on pull requests: it is the slowest job here
  # by several minutes, and Publish calls this workflow on the merge, so the
  # Dockerfile is still built before anything reaches a registry. The job stays
  # rather than being skipped outright, because `docker` is a required status
  # check — a skipped job never reports one, and the pull request would wait on
  # it forever. What it keeps on a pull request is the toolchain-pin
  # comparison, which is a file read and costs nothing.
  docker:
    runs-on: ubuntu-latest
    steps:
      # Full history: the onnxruntime link check below decides whether to run
      # by diffing against the pull request's base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Two pins for one toolchain only stay honest if something compares them.
      - name: Check Dockerfile matches rust-toolchain.toml
        run: |
          pinned=$(sed -ne 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          image=$(sed -ne 's/^FROM rust:\([^-]*\)-[a-z]* AS builder$/\1/p' Dockerfile)
          if [ -z "${pinned}" ] || [ -z "${image}" ]; then
            echo "could not read both toolchain pins (file='${pinned}' image='${image}')" >&2
            exit 1
          fi
          if [ "${pinned}" != "${image}" ]; then
            echo "rust-toolchain.toml pins ${pinned} but Dockerfile builds on rust:${image}" >&2
            exit 1
          fi
          echo "both pin Rust ${pinned}"
      # The builder and runtime stages must share a Debian release. The static
      # onnxruntime that `ort-sys` links needs GCC 14's libstdc++ (#258), so the
      # builder cannot be older than trixie, and the binary then needs that same
      # libstdc++ at run time, so the runtime image cannot be older than the
      # builder. Comparing the two names catches a bump to one and not the other
      # before the image is even built.
      - name: Check builder and runtime stages share a Debian release
        run: |
          builder=$(sed -ne 's/^FROM rust:[^-]*-\([a-z]*\) AS builder$/\1/p' Dockerfile)
          runtime=$(sed -ne 's/^FROM debian:\([a-z]*\)-slim AS runtime$/\1/p' Dockerfile)
          if [ -z "${builder}" ] || [ -z "${runtime}" ]; then
            echo "could not read both Debian releases (builder='${builder}' runtime='${runtime}')" >&2
            exit 1
          fi
          if [ "${builder}" != "${runtime}" ]; then
            echo "builder stage is Debian ${builder} but runtime stage is Debian ${runtime}" >&2
            exit 1
          fi
          echo "both stages are Debian ${builder}"
      # `conduit-vad` links the prebuilt static onnxruntime that `ort-sys`
      # downloads, and those objects are compiled with some GCC whose version
      # the crate records nowhere (#279). The requirement it places on the
      # image's libstdc++ can therefore rise on any `ort` bump, silently: the
      # `check` job builds on the runner's toolchain and never sees it, and
      # the image build that would see it does not run on pull requests.
      #
      # Linking the vad test binary inside the builder image is the cheap
      # version of that build — one crate, no release profile — and it is the
      # exact failure #258 hit. It runs on merges, and on a pull request only
      # when something that can move the requirement changed, so an `ort` bump
      # fails in review rather than after it.
      - name: Decide whether the onnxruntime link needs rechecking
        id: ort_link
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "${base}...HEAD")
          if echo "${changed}" | grep -qE '^(Dockerfile|rust-toolchain.toml|Cargo.lock|Cargo.toml|crates/conduit-vad/)'; then
            echo "an ort, toolchain or image change is in this diff; rechecking the link"
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "nothing here can move the onnxruntime requirement; skipping"
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check conduit-vad links against the builder image's libstdc++
        if: steps.ort_link.outputs.needed == 'true'
        run: |
          builder=$(sed -ne 's/^FROM \(rust:[^ ]*\) AS builder$/\1/p' Dockerfile)
          echo "linking conduit-vad inside ${builder}"
          docker run --rm --volume "${PWD}:/src" --workdir /src "${builder}" \
            cargo test -p conduit-vad --no-run --locked
      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'
      # Deliberately uncached. A `type=gha,mode=max` cache of a Rust release
      # build runs to gigabytes and would evict the `check` job's rust-cache
      # entries from the same 10 GB repository budget, making the far more
      # frequent job slower to speed up this one.
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: false
          load: true
          tags: conduit:ci
      # A build that links is not yet an image that runs: the binary loads
      # libstdc++ and glibc from the runtime stage, and a mismatch there only
      # shows at start-up. Starting the container and reading /health is the
      # cheapest proof that the two stages agree.
      - name: Check the built image starts
        if: github.event_name != 'pull_request'
        run: |
          docker run --detach --name conduit-ci --publish 9090:9090 \
            --env CONDUIT_ALLOW_ANONYMOUS=true conduit:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9090/health; then
              echo
              docker rm --force conduit-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "conduit-api did not answer /health within 30s" >&2
          docker logs conduit-ci >&2
          docker rm --force conduit-ci >/dev/null
          exit 1

  # Advisories change without any commit of ours, so this runs on a schedule
  # as well as per change, and is kept separate to distinguish "this pull
  # request broke something" from "the world changed under us".
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      # Uses .cargo/audit.toml, where every ignored advisory carries a reason.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      # The frontend lockfile is audited here for the same reason: a
      # transitive advisory (nanoid via postcss via vite, in #247) sat unnoticed
      # because `npm ci` only prints the count and nothing failed on it. `npm
      # audit` reads the lockfile directly, so no install is needed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - working-directory: frontend
        run: npm audit --audit-level=high
