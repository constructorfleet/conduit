name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    # The PostgreSQL tests skip themselves when no database is configured, so
    # without this they would pass by not running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUIT_TEST_POSTGRES_URL: postgres://conduit:conduit@localhost:5432/conduit_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The default feature set must build too, and so must the lean one.
      - run: cargo build --workspace --no-default-features

  # Advisories change without any commit of ours, so this runs on a schedule
  # as well as per change, and is kept separate to distinguish "this pull
  # request broke something" from "the world changed under us".
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Uses .cargo/audit.toml, where every ignored advisory carries a reason.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  publish-docker:
    runs-on: ubuntu-latest
    needs: [check, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: [check, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p conduit-api
      - name: Package Rust app and firmware YAMLs
        run: |
          mkdir -p dist/app dist/firmware
          cp target/release/conduit-api dist/app/conduit-api
          cp firmware/esphome/conduit-sat1.yaml dist/firmware/conduit-sat1.yaml
          cp firmware/esphome/conduit-voicepe.yaml dist/firmware/conduit-voicepe.yaml
          tar -C dist/app -czf dist/conduit-api-linux-x86_64.tar.gz conduit-api
          tar -C dist/firmware -czf dist/conduit-firmware-yamls.tar.gz conduit-sat1.yaml conduit-voicepe.yaml
      - id: artifact
        run: |
          artifact="${REGISTRY}/${GITHUB_REPOSITORY,,}/conduit-artifacts"
          echo "name=${artifact}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - name: Publish repo package
        run: |
          oras push "${{ steps.artifact.outputs.name }}:latest" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            "dist/conduit-api-linux-x86_64.tar.gz:application/gzip" \
            "dist/conduit-firmware-yamls.tar.gz:application/gzip"
