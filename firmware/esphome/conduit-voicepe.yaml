substitutions:
  name: conduit-voicepe
  friendly_name: Conduit Voice PE
  conduit_server: 192.168.1.10:8080
  conduit_pipeline: kitchen
  conduit_scheme: ws
  wake_debug_assistant_id: ${conduit_pipeline}
  wake_debug_udp_host: ""
  wake_debug_udp_port: "6056"
  wake_debug_event_url: ""
  # Official board firmware source: https://github.com/esphome/home-assistant-voice-pe
  voicepe_ref: 0579e7b9d8504264719c593474c85447253c9dc1

external_components:
  - source:
      type: local
      path: components
    components:
      - conduit_voice

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.6.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8
  - id: i2s_input
    i2s_lrclk_pin: GPIO14
    i2s_bclk_pin: GPIO13

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo
    adc_type: external

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac
    dac_type: external
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: i2s_audio_speaker
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: template
    id: master_mute_switch
    name: Mute
    icon: mdi:microphone-off
    entity_category: config
    lambda: |-
      return id(hardware_mute_switch).state || id(i2s_mics).get_mute_state();
    turn_on_action:
      - microphone.mute:
    turn_off_action:
      - microphone.unmute:

binary_sensor:
  - platform: gpio
    id: center_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                switch.is_off: master_mute_switch
              then:
                - conduit_voice.start:
                    id: conduit
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          - conduit_voice.wake_debug_event:
              id: conduit
          - conduit_voice.start:
              id: conduit

conduit_voice:
  id: conduit
  server: ${conduit_server}
  scheme: ${conduit_scheme}
  pipeline: ${conduit_pipeline}
  debug_assistant_id: ${wake_debug_assistant_id}
  debug_udp_host: ${wake_debug_udp_host}
  debug_udp_port: ${wake_debug_udp_port}
  debug_wake_event_url: ${wake_debug_event_url}
  microphone: i2s_mics
  speaker: announcement_resampling_speaker
