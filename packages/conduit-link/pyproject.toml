[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-link"
version = "0.0.0"
description = "Shared client + storage + FastAPI router for the Conduit link protocol (spec 0005)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["conduit_link*"]

[tool.mypy]
strict = true
files = ["conduit_link", "examples"]
