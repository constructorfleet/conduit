[package]
name = "conduit-bedrock"
description = "Amazon Bedrock Converse API language model provider for Conduit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["bedrock"]
# Reaching Bedrock, which needs the AWS SDK and its ~40 transitive crates. Off,
# the provider still exists and refuses to build with a message naming this
# feature, so a lean build says so rather than registering a model that cannot
# answer.
bedrock = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
]

[dependencies]
conduit-core.workspace = true
conduit-http.workspace = true
conduit-provider.workspace = true

async-trait.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tracing.workspace = true

# `default-features = false` on all four, and the TLS choice made at the
# smithy-http-client level rather than here. The SDK's own `rustls` feature
# routes through `aws-smithy-runtime/tls-rustls`, which selects `aws-lc-rs` —
# a C library needing cmake to build, and a second cryptographic provider
# beside the ring the rest of this workspace already links. Depending on
# `aws-smithy-http-client` directly is what makes `rustls-ring` selectable, and
# the client is then handed to the SDK explicitly.
aws-config = { version = "1.10", default-features = false, features = [
    "rt-tokio",
    "credentials-process",
    "sso",
], optional = true }
aws-credential-types = { version = "1.3", default-features = false, optional = true }
aws-sdk-bedrockruntime = { version = "1.139", default-features = false, features = [
    "rt-tokio",
], optional = true }
aws-smithy-http-client = { version = "1.2", default-features = false, features = [
    "rustls-ring",
], optional = true }
aws-smithy-runtime-api = { version = "1.14", default-features = false, features = [
    "client",
    "http-auth",
], optional = true }
aws-smithy-types = { version = "1.6", default-features = false, optional = true }

[dev-dependencies]
# `test-util` for the `env`/`fs` overrides on the config loader, which is what
# lets a credential-resolution test read a profile out of an in-memory file
# rather than mutating this process's environment — the latter is `unsafe` and
# races the other tests in the binary. Not a TLS feature: it enables
# `aws-runtime/test-util`, no crypto provider of its own.
aws-config = { version = "1.10", default-features = false, features = ["test-util"] }
aws-types = { version = "1.5", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
