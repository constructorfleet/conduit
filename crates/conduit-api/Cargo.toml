[package]
name = "conduit-api"
description = "HTTP and event-stream API for the Conduit voice assistant framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conduit-core.workspace = true
conduit-metrics.workspace = true
conduit-openai.workspace = true
conduit-provider.workspace = true
conduit-runtime.workspace = true

axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Registers the in-memory echo providers so the server can hold a conversation
# with no speech engine or model server. For development only.
dev-providers = ["conduit-provider/testing"]

[dev-dependencies]
conduit-metrics.workspace = true
conduit-provider = { workspace = true, features = ["testing"] }
futures-util.workspace = true
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
