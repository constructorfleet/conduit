[package]
name = "conduit-api"
description = "HTTP and event-stream API for the Conduit voice assistant framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conduit-core.workspace = true
conduit-mcp.workspace = true
conduit-memory.workspace = true
conduit-metrics.workspace = true
conduit-anthropic.workspace = true
conduit-bedrock.workspace = true
conduit-deepgram.workspace = true
conduit-elevenlabs.workspace = true
conduit-google.workspace = true
conduit-marytts.workspace = true
conduit-openai.workspace = true
conduit-provider.workspace = true
conduit-speaker.workspace = true
conduit-wake.workspace = true
conduit-store.workspace = true
conduit-script.workspace = true
conduit-transform.workspace = true
conduit-runtime.workspace = true
conduit-wyoming.workspace = true

async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
base64.workspace = true

[features]
default = ["postgres"]
# PostgreSQL storage for pipeline definitions, and for memory records: a
# deployment that has a database for one has it for the other.
postgres = ["conduit-store/postgres", "conduit-memory/postgres", "conduit-memory/openai"]
# Registers the in-memory echo providers so the server can hold a conversation
# with no speech engine or model server. For development only.
dev-providers = ["conduit-provider/testing"]

[dev-dependencies]
conduit-core = { workspace = true, features = ["testing"] }
conduit-metrics.workspace = true
conduit-store.workspace = true
conduit-provider = { workspace = true, features = ["testing"] }
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
uuid.workspace = true

[lints]
workspace = true
