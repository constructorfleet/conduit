[package]
name = "conduit-polly"
description = "Amazon Polly speech synthesis provider for Conduit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["polly"]
polly = [
    "dep:aws-config",
    "dep:aws-smithy-runtime-api",
    "dep:aws-sdk-polly",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
]

[dependencies]
conduit-core.workspace = true
conduit-http.workspace = true
conduit-provider.workspace = true

async-trait.workspace = true
futures-util.workspace = true
tracing.workspace = true

aws-config = { version = "1.10", default-features = false, features = [
    "rt-tokio",
    "credentials-process",
    "sso",
], optional = true }
aws-sdk-polly = { version = "1.98", default-features = false, features = [
    "rt-tokio",
], optional = true }
aws-smithy-http-client = { version = "1.2", default-features = false, features = [
    "rustls-ring",
], optional = true }
aws-smithy-runtime-api = { version = "1.14", default-features = false, features = [
    "client",
    "http-auth",
], optional = true }
aws-smithy-types = { version = "1.6", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
