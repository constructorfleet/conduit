[package]
name = "conduit-provider"
description = "Provider interfaces every Conduit STT, TTS, LLM, wake word, and memory plugin implements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conduit-core.workspace = true

async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
# In-memory providers for development and tests. Off by default so nothing
# ships a pipeline that only pretends to hear.
testing = ["dep:futures-util"]

[dev-dependencies]
conduit-provider = { workspace = true, features = ["testing"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
