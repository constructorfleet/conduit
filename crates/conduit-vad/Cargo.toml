[package]
name = "conduit-vad"
description = "In-process voice activity detection for Conduit, scoring the Silero ONNX model with no service to run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx"]
# Scoring the model in process. Off, the detector still exists and refuses to
# load with a message naming this feature, so a build without an inference
# runtime says so rather than registering a detector that hears nothing. The
# same arrangement `conduit-wake` uses, and for the same reason.
onnx = ["dep:ort", "dep:ndarray"]

[dependencies]
conduit-core.workspace = true
conduit-provider.workspace = true

async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tokio-stream.workspace = true
tracing.workspace = true
# `ort` rather than the `tract` `conduit-wake` scores its models with, and not by
# preference: Silero's decoder uses ONNX `If` nodes structurally — to reshape —
# and `tract` implements `If` as an op it can only compile when the branch
# condition folds at analysis time. Rewriting the `sr` input into a constant does
# fold the top-level rate switch, but the decoder's branches have genuinely
# different output shapes, so neither one alone is the model. Every published
# export fails the same way, including the one named `ifless`. `conduit-wake`
# keeps `tract`, which loads openWakeWord fine.
ort = { version = "=2.0.0-rc.10", optional = true }
ndarray = { version = "0.16", optional = true }

[dev-dependencies]
bytes.workspace = true
# Reading the speech fixture `conduit-wake` already carries, so the one assertion
# that a detector finds real speech runs against a real voice.
hound = "3"
conduit-provider.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
