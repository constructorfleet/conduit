# Conduit, and the optional services a pipeline can point at.
#
#   docker compose up                          # just Conduit
#   docker compose --profile speaker-id up     # and speaker identification
#   docker compose --profile wyoming-asr up    # and local speech recognition
#   docker compose --profile openwakeword up   # and a wake word server
#
# Waking on a phrase needs no profile at all if you use openWakeWord: Conduit
# scores its models itself. Put them in the `wake-models` volume and point a
# provider definition at `local`. The profiles below are for the cases that do
# need a service — microWakeWord, nanoWakeWord, or an openWakeWord you would
# rather run separately.
#
# Voice activity detection is the same arrangement and has no profile at all:
# Silero is one small model Conduit scores itself, so the `vad-models` volume is
# the whole of it.
#
# Everything optional sits behind a profile, so the default is the smallest
# thing that runs. Optional services are deliberately not published to the
# host: Conduit reaches them over the compose network by service name, and a
# port mapping would put an unauthenticated model server on your LAN.

services:
  conduit:
    build:
      context: .
    # The service API. 9090 serves /health and /metrics with no authentication
    # at all, so it is deliberately unmapped — reach it from inside the network
    # or add a mapping you have decided is inside your trust boundary.
    ports:
      - "${CONDUIT_PORT:-8080}:8080"
    environment:
      # There is no open default: a server with neither a token file nor
      # anonymous mode refuses to start, and that refusal is the intended
      # behaviour rather than a papercut. Set one of these in .env.
      CONDUIT_TOKENS: ${CONDUIT_TOKENS:-}
      CONDUIT_ALLOW_ANONYMOUS: ${CONDUIT_ALLOW_ANONYMOUS:-}
      CONDUIT_LOG: ${CONDUIT_LOG:-info}
      CONDUIT_DATA_DIR: /var/lib/conduit
    volumes:
      - conduit-data:/var/lib/conduit
      # openWakeWord models, for a definition whose runtime is `local`. Put
      # `melspectrogram.onnx`, `embedding_model.onnx` and one `<phrase>.onnx`
      # per wake phrase in here; `scripts/fetch-wake-models.sh` downloads a set.
      # A definition that names no `models_dir` reads exactly this directory.
      - wake-models:/var/lib/conduit/wake-models
      # The Silero VAD model, for a `vad` stage. One file rather than three —
      # Silero is a single model, not a chain — and `scripts/fetch-vad-model.sh`
      # downloads it. A definition that names no `model_path` reads exactly this
      # directory. There is no profile and no service here for the same reason
      # `local` wake needs none: the model is under two megabytes and Conduit
      # scores it in process.
      - vad-models:/var/lib/conduit/vad-models
      # Where a token file goes when you use one. Create ./secrets/tokens.json
      # and set CONDUIT_TOKENS=/run/secrets/tokens.json; the file must not be
      # group- or world-readable, which Conduit checks at startup.
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  # Speaker identification, reached at http://speaker-id:8080 from Conduit.
  #
  # Create a provider definition of type `http_speaker_id` whose `base_url` is
  # that address, then add a Speaker ID stage to a pipeline.
  #
  # Set CONDUIT_SPEAKER_ID_IMAGE to pin a published tag, or leave it unset to
  # build from this repository. The GPU tag is the same image with a CUDA base:
  # see services/speaker-id/README.md.
  speaker-id:
    profiles: ["speaker-id"]
    image: ${CONDUIT_SPEAKER_ID_IMAGE:-conduit-speaker-id:speechbrain}
    build:
      context: ./services/speaker-id
    environment:
      # Optional. When set, Conduit's provider definition needs the same value
      # as its api_key. Unset means the service is open, which is only
      # reasonable because its port is not published.
      SPEAKER_ID_API_KEY: ${SPEAKER_ID_API_KEY:-}
    volumes:
      # Voice prints outlive the container, or every household member is a
      # stranger again after an update.
      - speaker-id-data:/data
      # The model, so a restart does not re-download several hundred megabytes.
      - speaker-id-models:/models
    restart: unless-stopped

  # Speech recognition, reached at tcp://wyoming-asr:10300 from Conduit.
  #
  # Create a provider definition of type `wyoming` whose `url` is that address,
  # then add a Speech-to-text stage to a pipeline. Leave `streaming` false: the
  # service is batch-only and says so in its own handshake.
  #
  # Which weights it serves is ASR_ENGINE and ASR_MODEL, and the model licence is
  # yours to honour — Canary is CC-BY-4.0. See services/wyoming-asr/README.md.
  wyoming-asr:
    profiles: ["wyoming-asr"]
    image: ${CONDUIT_WYOMING_ASR_IMAGE:-conduit-wyoming-asr:canary}
    build:
      context: ./services/wyoming-asr
    environment:
      ASR_ENGINE: ${ASR_ENGINE:-canary}
      ASR_MODEL: ${ASR_MODEL:-}
      # `cuda` needs a container runtime with GPU access and the GPU tag; the
      # process refuses to start rather than run twenty times slower in silence.
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      # Spelled out rather than left empty: `float("")` is a crash loop, and an
      # unset variable in compose arrives as an empty string, not as absent.
      ASR_MAX_SECONDS: ${ASR_MAX_SECONDS:-120}
    volumes:
      # The weights, which run to gigabytes. Without this a restart downloads
      # them again.
      - wyoming-asr-models:/models
    restart: unless-stopped

  # Wake word servers, reached at tcp://<service>:10400 from Conduit.
  #
  # One profile per engine, because which one you run decides which phrases you
  # can ask for — a microWakeWord manifest, an openWakeWord model, a
  # nanoWakeWord model — and a provider definition names the engine as its type.
  # Create a definition whose runtime is `wyoming` and whose `url` is that
  # address, then add a Wake word stage to a pipeline.
  #
  # The images are yours to choose, for the same reason the speaker-id one is,
  # so they come from .env. Activating a profile without setting its variable
  # fails with "neither an image nor a build context" — that is the variable
  # that is missing.
  openwakeword:
    profiles: ["openwakeword"]
    image: ${CONDUIT_OPENWAKEWORD_IMAGE:-}
    volumes:
      # The models, so a restart does not re-download them.
      - openwakeword-models:/models
    restart: unless-stopped

  microwakeword:
    profiles: ["microwakeword"]
    image: ${CONDUIT_MICROWAKEWORD_IMAGE:-}
    volumes:
      - microwakeword-models:/models
    restart: unless-stopped

  nanowakeword:
    profiles: ["nanowakeword"]
    image: ${CONDUIT_NANOWAKEWORD_IMAGE:-}
    volumes:
      - nanowakeword-models:/models
    restart: unless-stopped

volumes:
  conduit-data:
  wake-models:
  vad-models:
  speaker-id-data:
  speaker-id-models:
  wyoming-asr-models:
  openwakeword-models:
  microwakeword-models:
  nanowakeword-models:
